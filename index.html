    <style>

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

                opacity: 1;
                transform: translateY(0);
            }

                opacity: 0;
                transform: translateX(-20px);
            }
            to {

                transform: translateX(0);
            }

                box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            }
            50% {

            }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }

        .animate-slide-in {
            animation: slideIn 0.5s ease-out;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;

        ::-webkit-scrollbar-thumb:hover {

        }

        /* Glass Effect */
        .glass {

            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        /* Custom Input Styling */
        input, textarea, select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.75rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);

        /* Button Styling */

            transition: all 0.3s ease;

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        /* Loading Animation */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Card Styling */
        .card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent);
            background: rgba(30, 41, 59, 0.8);
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;

        th {
            background: rgba(15, 23, 42, 0.8);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--border);
            color: var(--accent-light);

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);

        }

        /* Status Badges */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .badge-error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .badge-info {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-light);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 1rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: fadeInUp 0.3s ease-out;
        }

        /* Code Block */
        .code-block {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            overflow-x: auto;
            color: var(--accent-light);
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%);
            transition: width 0.3s ease;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // ============================================
        // UNIVERSAL AI FILE INTELLIGENCE ENGINE
        // Core AI Detection & Parsing Pipeline
        // ============================================

        class FileIntelligenceEngine {
            constructor() {
                this.parsers = new Map();
                this.schemaInference = new SchemaInferenceEngine();
                this.registerDefaultParsers();
            }

            registerDefaultParsers() {
                this.parsers.set('csv', new CSVParser());
                this.parsers.set('json', new JSONParser());
                this.parsers.set('xlsx', new ExcelParser());
                this.parsers.set('xml', new XMLParser());
                this.parsers.set('txt', new TextParser());
            }

            async detectFileType(file, content) {
                const name = file.name.toLowerCase();
                const ext = name.split('.').pop();

                // Extension-based detection
                if (this.parsers.has(ext)) {
                    return { type: ext, confidence: 0.95 };
                }

                // Content-based detection (heuristic)
                return this.detectByContent(content);
            }

            detectByContent(content) {
                const text = typeof content === 'string' ? content : new TextDecoder().decode(content.slice(0, 1000));

                // JSON detection
                if (text.trim().startsWith('{') || text.trim().startsWith('[')) {
                    try {
                        JSON.parse(text);
                        return { type: 'json', confidence: 0.98 };
                    } catch (e) { }
                }

                // XML detection
                if (text.trim().startsWith('<')) {
                    return { type: 'xml', confidence: 0.95 };
                }

                // CSV detection
                if (text.includes(',') || text.includes('\t')) {
                    const lines = text.split('\n').slice(0, 5);
                    const consistentCols = lines.every((line, i) => {
                        if (i === 0) return true;
                        return line.split(',').length === lines[0].split(',').length;
                    });
                    if (consistentCols) {
                        return { type: 'csv', confidence: 0.85 };
                    }
                }

                return { type: 'txt', confidence: 0.5 };
            }

            async parseFile(file) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const detection = await this.detectFileType(file, arrayBuffer);
                    const parser = this.parsers.get(detection.type);

                    if (!parser) {
                        throw new Error(`No parser found for type: ${detection.type}`);
                    }

                    const parsed = await parser.parse(arrayBuffer, file);
                    
                    // Infer schema
                    const schema = this.schemaInference.infer(parsed.records);

                    return {
                        fileInfo: {
                            name: file.name,
                            size: file.size,
                            type: file.type,
                            detectedType: detection.type,
                            confidence: detection.confidence,
                            uploadedAt: new Date().toISOString(),
                        },
                        records: parsed.records,
                        schema: schema,
                        rowCount: parsed.records.length,
                        columnCount: schema.fields.length,
                        dataQuality: this.analyzeQuality(parsed.records, schema),
                    };
                } catch (error) {
                    throw new Error(`Failed to parse file: ${error.message}`);
                }
            }

            analyzeQuality(records, schema) {
                const quality = {
                    completeness: 0,
                    consistency: 0,
                    anomalies: [],
                    missingFields: {},
                    duplicates: 0,
                };

                if (records.length === 0) {
                    return quality;
                }

                // Check completeness
                let totalFields = 0;
                let filledFields = 0;

                records.forEach(record => {
                    schema.fields.forEach(field => {
                        totalFields++;
                        const value = record[field.name];
                        if (value !== null && value !== undefined && value !== '') {
                            filledFields++;
                        } else {
                            quality.missingFields[field.name] = (quality.missingFields[field.name] || 0) + 1;
                        }
                    });
                });

                quality.completeness = Math.round((filledFields / totalFields) * 100);

                // Check for duplicates
                const serialized = records.map(r => JSON.stringify(r));
                const unique = new Set(serialized);
                quality.duplicates = records.length - unique.size;

                // Anomaly detection
                schema.fields.forEach(field => {
                    const values = records.map(r => r[field.name]).filter(v => v != null);
                    const typeViolations = values.filter(v => 
                        !this.matchesType(v, field.inferredType)
                    ).length;

                    if (typeViolations > values.length * 0.1) {
                        quality.anomalies.push({
                            field: field.name,
                            issue: 'Type inconsistency',
                            count: typeViolations,
                        });
                    }
                });

                quality.consistency = Math.round((1 - quality.anomalies.length / schema.fields.length) * 100);

                return quality;
            }

            matchesType(value, type) {
                switch (type) {
                    case 'number':
                        return !isNaN(parseFloat(value));
                    case 'boolean':
                        return value === true || value === false || value === 'true' || value === 'false';
                    case 'date':
                        return !isNaN(Date.parse(value));
                    case 'string':
                        return typeof value === 'string';
                    default:
                        return true;
                }
            }
        }

        // Schema Inference Engine
        class SchemaInferenceEngine {
            infer(records) {
                if (records.length === 0) {
                    return { fields: [], confidence: 0 };
                }

                const fieldMap = new Map();
                const fieldNames = new Set();

                // Collect all field names
                records.forEach(record => {
                    Object.keys(record).forEach(key => {
                        fieldNames.add(key);
                        if (!fieldMap.has(key)) {
                            fieldMap.set(key, {
                                name: key,
                                types: new Set(),
                                samples: [],
                                nullCount: 0,
                            });
                        }

                        const field = fieldMap.get(key);
                        const value = record[key];

                        if (value === null || value === undefined || value === '') {
                            field.nullCount++;
                        } else {
                            const type = this.inferType(value);
                            field.types.add(type);
                            if (field.samples.length < 3) {
                                field.samples.push(value);
                            }
                        }
                    });
                });

                const fields = Array.from(fieldMap.values()).map(field => {
                    const uniqueTypes = Array.from(field.types);
                    const inferredType = uniqueTypes.length === 1 ? uniqueTypes[0] : 'mixed';
                    const confidence = 1 - (field.nullCount / records.length);

                    return {
                        name: field.name,
                        inferredType: inferredType,
                        possibleTypes: uniqueTypes,
                        confidence: Math.round(confidence * 100),
                        nullCount: field.nullCount,
                        cardinality: new Set(
                            records
                                .map(r => r[field.name])
                                .filter(v => v != null)
                        ).size,
                        samples: field.samples,
                    };
                });

                return {
                    fields: fields,
                    fieldCount: fields.length,
                    confidence: Math.round(
                        fields.reduce((sum, f) => sum + f.confidence, 0) / fields.length
                    ),
                };
            }

            inferType(value) {
                if (value === null || value === undefined) return 'null';
                if (typeof value === 'boolean') return 'boolean';
                if (typeof value === 'number') return 'number';
                if (!isNaN(Date.parse(value)) && typeof value === 'string') return 'date';
                if (typeof value === 'string') {
                    if (!isNaN(parseFloat(value))) return 'number';
                    return 'string';
                }
                if (Array.isArray(value)) return 'array';
                if (typeof value === 'object') return 'object';
                return 'unknown';
            }
        }

        // ============================================
        // FILE PARSERS
        // ============================================

        class CSVParser {
            async parse(arrayBuffer, file) {
                const text = new TextDecoder().decode(arrayBuffer);
                return new Promise((resolve, reject) => {
                    Papa.parse(text, {
                        header: true,
                        skipEmptyLines: true,
                        dynamicTyping: true,
                        complete: (results) => {
                            resolve({
                                records: results.data.filter(r => Object.keys(r).some(k => r[k] != null)),
                            });
                        },
                        error: reject,
                    });
                });
            }
        }

        class JSONParser {
            async parse(arrayBuffer) {
                const text = new TextDecoder().decode(arrayBuffer);
                const data = JSON.parse(text);

                let records = [];
                if (Array.isArray(data)) {
                    records = data;
                } else if (typeof data === 'object') {
                    records = [data];
                }

                return { records };
            }
        }

        class ExcelParser {
            async parse(arrayBuffer) {
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const records = XLSX.utils.sheet_to_json(worksheet);
                return { records };
            }
        }

        class XMLParser {
            async parse(arrayBuffer) {
                const text = new TextDecoder().decode(arrayBuffer);
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'application/xml');

                const records = [];
                const items = doc.documentElement.querySelectorAll('*');

                items.forEach(item => {
                    const record = {};
                    item.attributes && Array.from(item.attributes).forEach(attr => {
                        record[attr.name] = attr.value;
                    });
                    if (item.textContent && item.textContent.trim()) {
                        record['content'] = item.textContent.trim();
                    }
                    if (Object.keys(record).length > 0) {
                        records.push(record);
                    }
                });

                return { records };
            }
        }

        class TextParser {
            async parse(arrayBuffer) {
                const text = new TextDecoder().decode(arrayBuffer);
                const lines = text.split('\n').filter(l => l.trim());
                const records = lines.map((line, idx) => ({
                    'line_number': idx + 1,
                    'content': line,
                }));
                return { records };
            }
        }

        // ============================================
        // REACT COMPONENTS & APP
        // ============================================

        const { useState, useCallback, useEffect, useRef } = React;
        const { Upload, BarChart3, Database, AlertCircle, CheckCircle, Eye, Download, Trash2, Code, Filter, Search } = lucide;

        const engine = new FileIntelligenceEngine();

        function DataQualityBadge({ data }) {
            const getColor = (value) => {
                if (value >= 90) return 'badge-success';
                if (value >= 70) return 'badge-warning';
                return 'badge-error';
            };

            return (
                <div className="grid grid-cols-3 gap-3">
                    <div className="card text-center">
                        <div className="text-2xl font-bold gradient-text">{data.completeness}%</div>
                        <div className="text-xs text-gray-400 mt-1">Completeness</div>
                    </div>
                    <div className="card text-center">
                        <div className="text-2xl font-bold gradient-text">{data.consistency}%</div>
                        <div className="text-xs text-gray-400 mt-1">Consistency</div>
                    </div>
                    <div className="card text-center">
                        <div className="text-2xl font-bold gradient-text">{data.duplicates}</div>
                        <div className="text-xs text-gray-400 mt-1">Duplicates</div>
                    </div>
                </div>
            );
        }

        function SchemaViewer({ schema }) {
            const [expandedFields, setExpandedFields] = useState({});

            const toggleField = (fieldName) => {
                setExpandedFields(prev => ({
                    ...prev,
                    [fieldName]: !prev[fieldName],
                }));
            };

            return (
                <div className="space-y-3">
                    {schema.fields.map((field, idx) => (
                        <div key={idx} className="card">
                            <div 
                                className="flex items-center justify-between cursor-pointer"
                                onClick={() => toggleField(field.name)}
                            >
                                <div className="flex items-center gap-3 flex-1">
                                    <Database size={18} className="text-accent-light" />
                                    <div className="flex-1">
                                        <div className="font-semibold">{field.name}</div>
                                        <div className="text-sm text-gray-400">
                                            {field.inferredType} • {field.cardinality} unique values
                                        </div>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className={`badge badge-info`}>
                                        {field.confidence}% confidence
                                    </span>
                                </div>
                            </div>
                            
                            {expandedFields[field.name] && (
                                <div className="mt-3 pt-3 border-t border-gray-700 text-sm text-gray-400">
                                    <div className="mb-2">
                                        <strong>Type:</strong> {field.possibleTypes.join(', ')}
                                    </div>
                                    <div className="mb-2">
                                        <strong>Null Values:</strong> {field.nullCount}
                                    </div>
                                    <div>
                                        <strong>Samples:</strong>
                                        <div className="code-block mt-2">
                                            {field.samples.map((s, i) => (
                                                <div key={i}>{JSON.stringify(s)}</div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        }

        function DataTableViewer({ records, schema }) {
            const [pageSize, setPageSize] = useState(10);
            const [page, setPage] = useState(0);
            const [searchTerm, setSearchTerm] = useState('');
            const [sortField, setSortField] = useState(null);
            const [sortOrder, setSortOrder] = useState('asc');

            const filteredRecords = records.filter(record =>
                Object.values(record).some(v =>
                    String(v).toLowerCase().includes(searchTerm.toLowerCase())
                )
            );

            const sortedRecords = sortField
                ? [...filteredRecords].sort((a, b) => {
                    const aVal = a[sortField];
                    const bVal = b[sortField];
                    if (aVal < bVal) return sortOrder === 'asc' ? -1 : 1;
                    if (aVal > bVal) return sortOrder === 'asc' ? 1 : -1;
                    return 0;
                })
                : filteredRecords;

            const paginatedRecords = sortedRecords.slice(page * pageSize, (page + 1) * pageSize);
            const totalPages = Math.ceil(sortedRecords.length / pageSize);

            const handleSort = (field) => {
                if (sortField === field) {
                    setSortOrder(sortOrder === 'asc' ? 'desc' : 'asc');
                } else {
                    setSortField(field);
                    setSortOrder('asc');
                }
            };

            return (
                <div className="space-y-4">
                    <div className="flex gap-2 mb-4">
                        <div className="flex-1 relative">
                            <Search size={18} className="absolute left-3 top-3 text-gray-500" />
                            <input
                                type="text"
                                placeholder="Search records..."
                                className="w-full pl-10"
                                value={searchTerm}
                                onChange={(e) => {
                                    setSearchTerm(e.target.value);
                                    setPage(0);
                                }}
                            />
                        </div>
                        <select
                            value={pageSize}
                            onChange={(e) => {
                                setPageSize(parseInt(e.target.value));
                                setPage(0);
                            }}
                            className="px-3"
                        >
                            <option value={10}>10 rows</option>
                            <option value={25}>25 rows</option>
                            <option value={50}>50 rows</option>
                            <option value={100}>100 rows</option>
                        </select>
                    </div>

                    <div className="overflow-x-auto glass rounded-lg">
                        <table>
                            <thead>
                                <tr>
                                    {schema.fields.map(field => (
                                        <th 
                                            key={field.name}
                                            onClick={() => handleSort(field.name)}
                                            className="cursor-pointer hover:bg-blue-900/20"
                                        >
                                            <div className="flex items-center gap-2">
                                                {field.name}
                                                {sortField === field.name && (
                                                    <span className="text-xs">
                                                        {sortOrder === 'asc' ? '↑' : '↓'}
                                                    </span>
                                                )}
                                            </div>
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {paginatedRecords.map((record, idx) => (
                                    <tr key={idx}>
                                        {schema.fields.map(field => (
                                            <td key={`${idx}-${field.name}`}>
                                                {record[field.name] === null || record[field.name] === undefined
                                                    ? <span className="text-gray-500">—</span>
                                                    : String(record[field.name]).substring(0, 50)}
                                            </td>
                                        ))}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div className="flex justify-between items-center">
                        <div className="text-sm text-gray-400">
                            Showing {paginatedRecords.length > 0 ? page * pageSize + 1 : 0} to {Math.min((page + 1) * pageSize, sortedRecords.length)} of {sortedRecords.length} records
                        </div>
                        <div className="flex gap-2">
                            <button
                                className="btn-secondary"
                                disabled={page === 0}
                                onClick={() => setPage(Math.max(0, page - 1))}
                            >
                                Previous
                            </button>
                            <div className="px-4 flex items-center">
                                Page {page + 1} of {totalPages}
                            </div>
                            <button
                                className="btn-secondary"
                                disabled={page >= totalPages - 1}
                                onClick={() => setPage(Math.min(totalPages - 1, page + 1))}
                            >
                                Next
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function FileUploadZone({ onFileSelected }) {
            const [isDragging, setIsDragging] = useState(false);
            const fileInputRef = useRef(null);

            const handleDragOver = (e) => {
                e.preventDefault();
                setIsDragging(true);
            };

            const handleDragLeave = () => {
                setIsDragging(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    onFileSelected(files[0]);
                }
            };

            const handleFileInput = (e) => {
                if (e.target.files.length > 0) {
                    onFileSelected(e.target.files[0]);
                }
            };

            return (
                <div
                    className={`border-2 border-dashed rounded-lg p-12 text-center cursor-pointer transition-all ${
                        isDragging
                            ? 'border-blue-400 bg-blue-900/20'
                            : 'border-blue-600/30 bg-blue-900/5 hover:border-blue-500'
                    }`}
                    onDragOver={handleDragOver}
                    onDragLeave={handleDragLeave}
                    onDrop={handleDrop}
                    onClick={() => fileInputRef.current?.click()}
                >
                    <input
                        ref={fileInputRef}
                        type="file"
                        onChange={handleFileInput}
                        className="hidden"
                        accept=".csv,.json,.xlsx,.xls,.xml,.txt"
                    />
                    <Upload size={48} className="mx-auto mb-4 text-blue-400 opacity-70" />
                    <h3 className="text-lg font-semibold mb-2">
                        Drop your file here or click to select
                    </h3>
                    <p className="text-gray-400">
                        Supports CSV, JSON, Excel, XML, and Text files
                    </p>
                    <p className="text-sm text-gray-500 mt-2">
                        The AI will automatically detect and parse your data
                    </p>
                </div>
            );
        }

        function AppHeader() {
            return (
                <div className="text-center mb-8 animate-fade-in-up">
                    <h1 className="text-4xl font-bold mb-2">
                        <span className="gradient-text">Universal AI File Intelligence</span>
                    </h1>
                    <p className="text-gray-400">
                        Intelligent file parsing, schema inference, and data analysis for any format
                    </p>
                </div>
            );
        }

        function AIStatsPanel({ data }) {
            return (
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div className="card text-center">
                        <div className="text-3xl font-bold gradient-text">{data.rowCount}</div>
                        <div className="text-sm text-gray-400 mt-1">Rows</div>
                    </div>
                    <div className="card text-center">
                        <div className="text-3xl font-bold gradient-text">{data.columnCount}</div>
                        <div className="text-sm text-gray-400 mt-1">Columns</div>
                    </div>
                    <div className="card text-center">
                        <div className="text-3xl font-bold gradient-text">{data.schema.confidence}%</div>
                        <div className="text-sm text-gray-400 mt-1">Schema Confidence</div>
                    </div>
                    <div className="card text-center">
                        <div className={`text-sm font-semibold ${
                            data.fileInfo.confidence >= 0.9 ? 'text-green-400' : 'text-yellow-400'
                        }`}>
                            {Math.round(data.fileInfo.confidence * 100)}% Type Confidence
                        </div>
                        <div className="text-sm text-gray-400 mt-1">{data.fileInfo.detectedType.toUpperCase()}</div>
                    </div>
                </div>
            );
        }

        function App() {
            const [fileData, setFileData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState('overview');

            const handleFileSelected = useCallback(async (file) => {
                setLoading(true);
                setError(null);

                try {
                    const result = await engine.parseFile(file);
                    setFileData(result);
                    setActiveTab('overview');
                } catch (err) {
                    setError(err.message);
                }

                setLoading(false);
            }, []);

            const exportAsJSON = () => {
                if (!fileData) return;
                const json = JSON.stringify(fileData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${fileData.fileInfo.name}-extracted.json`;
                a.click();
            };

            const exportAsCSV = () => {
                if (!fileData) return;
                const headers = fileData.schema.fields.map(f => f.name);
                const rows = fileData.records.map(r =>
                    headers.map(h => {
                        const val = r[h];
                        return typeof val === 'string' && val.includes(',')
                            ? `"${val}"`
                            : val;
                    }).join(',')
                );
                const csv = [headers.join(','), ...rows].join('\n');
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${fileData.fileInfo.name}-extracted.csv`;
                a.click();
            };

            const clearData = () => {
                setFileData(null);
                setError(null);
                setActiveTab('overview');
            };

            if (!fileData) {
                return (
                    <div className="min-h-screen p-6 md:p-12">
                        <div className="max-w-6xl mx-auto">
                            <AppHeader />
                            <div className="card animate-fade-in-up" style={{animationDelay: '0.1s'}}>
                                <FileUploadZone onFileSelected={handleFileSelected} />
                            </div>
                            {error && (
                                <div className="mt-6 p-4 bg-red-900/20 border border-red-600 rounded-lg flex gap-3 animate-fade-in-up">
                                    <AlertCircle size={20} className="text-red-400 flex-shrink-0" />
                                    <div>
                                        <h3 className="font-semibold text-red-400">Error</h3>
                                        <p className="text-sm text-red-300 mt-1">{error}</p>
                                    </div>
                                </div>
                            )}
                            {loading && (
                                <div className="mt-6 flex items-center justify-center gap-3">
                                    <div className="spinner"></div>
                                    <span className="text-gray-400">Analyzing file...</span>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-6 md:p-8">
                    <div className="max-w-7xl mx-auto">
                        {/* Header with file info */}
                        <div className="flex items-center justify-between mb-8 animate-fade-in-up">
                            <div>
                                <h1 className="text-3xl font-bold gradient-text mb-2">
                                    {fileData.fileInfo.name}
                                </h1>
                                <div className="flex flex-wrap gap-3">
                                    <span className="badge badge-info">
                                        {fileData.fileInfo.detectedType.toUpperCase()} • {(fileData.fileInfo.size / 1024 / 1024).toFixed(2)} MB
                                    </span>
                                    <span className={`badge ${
                                        fileData.fileInfo.confidence >= 0.9 ? 'badge-success' : 'badge-warning'
                                    }`}>
                                        {Math.round(fileData.fileInfo.confidence * 100)}% confidence
                                    </span>
                                </div>
                            </div>
                            <button
                                onClick={clearData}
                                className="btn-secondary flex items-center gap-2"
                            >
                                <Trash2 size={18} />
                                Clear
                            </button>
                        </div>

                        {/* Stats Panel */}
                        <AIStatsPanel data={fileData} />

                        {/* Tab Navigation */}
                        <div className="flex gap-2 mb-6 border-b border-gray-700 pb-4 overflow-x-auto">
                            {[
                                { id: 'overview', label: 'Overview', icon: BarChart3 },
                                { id: 'schema', label: 'Schema', icon: Database },
                                { id: 'data', label: 'Data Table', icon: Eye },
                                { id: 'quality', label: 'Quality', icon: AlertCircle },
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-4 py-2 rounded transition-all ${
                                        activeTab === tab.id
                                            ? 'bg-blue-600 text-white'
                                            : 'text-gray-400 hover:text-gray-200'
                                    }`}
                                >
                                    <tab.icon size={18} />
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        {/* Tab Content */}
                        <div className="animate-fade-in-up">
                            {activeTab === 'overview' && (
                                <div className="space-y-6">
                                    <div className="card">
                                        <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                                            <CheckCircle size={24} className="text-green-400" />
                                            File Analysis Summary
                                        </h2>
                                        <div className="grid md:grid-cols-2 gap-6">
                                            <div>
                                                <h3 className="font-semibold mb-3">File Information</h3>
                                                <div className="space-y-2 text-sm">
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-400">File Name:</span>
                                                        <span className="font-mono">{fileData.fileInfo.name}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-400">Detected Type:</span>
                                                        <span className="text-blue-400 font-semibold">
                                                            {fileData.fileInfo.detectedType.toUpperCase()}
                                                        </span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-400">File Size:</span>
                                                        <span>{(fileData.fileInfo.size / 1024).toFixed(2)} KB</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-400">Uploaded At:</span>
                                                        <span className="font-mono text-xs">
                                                            {new Date(fileData.fileInfo.uploadedAt).toLocaleString()}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div>
                                                <h3 className="font-semibold mb-3">Data Statistics</h3>
                                                <div className="space-y-2 text-sm">
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-400">Total Rows:</span>
                                                        <span className="text-blue-400 font-bold">{fileData.rowCount}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-400">Total Columns:</span>
                                                        <span className="text-blue-400 font-bold">{fileData.columnCount}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-400">Schema Confidence:</span>
                                                        <span className="text-green-400 font-bold">{fileData.schema.confidence}%</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-400">Total Fields:</span>
                                                        <span className="text-blue-400 font-bold">{fileData.schema.fields.length}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="card">
                                        <h2 className="text-xl font-bold mb-4">Export Data</h2>
                                        <div className="flex gap-3">
                                            <button
                                                onClick={exportAsJSON}
                                                className="btn-primary flex items-center gap-2"
                                            >
                                                <Code size={18} />
                                                Export as JSON
                                            </button>
                                            <button
                                                onClick={exportAsCSV}
                                                className="btn-primary flex items-center gap-2"
                                            >
                                                <Download size={18} />
                                                Export as CSV
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'schema' && (
                                <div className="card">
                                    <h2 className="text-xl font-bold mb-6">Inferred Schema</h2>
                                    <SchemaViewer schema={fileData.schema} />
                                </div>
                            )}

                            {activeTab === 'data' && (
                                <div className="card">
                                    <h2 className="text-xl font-bold mb-6">Data Preview</h2>
                                    <DataTableViewer
                                        records={fileData.records}
                                        schema={fileData.schema}
                                    />
                                </div>
                            )}

                            {activeTab === 'quality' && (
                                <div className="space-y-6">
                                    <div className="card">
                                        <h2 className="text-xl font-bold mb-6">Data Quality Analysis</h2>
                                        <DataQualityBadge data={fileData.dataQuality} />
                                    </div>

                                    {fileData.dataQuality.anomalies.length > 0 && (
                                        <div className="card">
                                            <h3 className="font-semibold mb-4 text-orange-400">
                                                ⚠️ Detected Anomalies
                                            </h3>
                                            <div className="space-y-2">
                                                {fileData.dataQuality.anomalies.map((anomaly, idx) => (
                                                    <div key={idx} className="p-3 bg-orange-900/20 border border-orange-600/30 rounded">
                                                        <div className="font-semibold text-sm">{anomaly.field}</div>
                                                        <div className="text-sm text-gray-300">
                                                            {anomaly.issue} ({anomaly.count} occurrences)
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {Object.keys(fileData.dataQuality.missingFields).length > 0 && (
                                        <div className="card">
                                            <h3 className="font-semibold mb-4 text-gray-300">
                                                Missing Values by Field
                                            </h3>
                                            <div className="space-y-3">
                                                {Object.entries(fileData.dataQuality.missingFields).map(([field, count]) => (
                                                    <div key={field}>
                                                        <div className="flex justify-between mb-1">
                                                            <span className="text-sm">{field}</span>
                                                            <span className="text-xs text-gray-400">
                                                                {count} missing ({Math.round(count / fileData.rowCount * 100)}%)
                                                            </span>
                                                        </div>
                                                        <div className="progress-bar">
                                                            <div
                                                                className="progress-fill"
                                                                style={{
                                                                    width: `${(count / fileData.rowCount) * 100}%`,
                                                                }}
                                                            ></div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Render App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
